[project]
name = "memory-rot"
version = "0.1.0"
description = "Do stale facts override new ones in LLM agent memory? A controlled study on synthetic multi-session histories."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kameswara Sai Srikar Manda" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "sentence-transformers>=3.0",
]

[project.scripts]
memrot = "memrot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memrot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
